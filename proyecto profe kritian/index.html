<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎶 Top Music 🎶</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black">
    <div class="container-fluid text-center"> 
      <a class="navbar-brand h1 fw-bold mx-auto" href="#">🎶 Top Music 🎶</a>
    </div>
</nav>

  <div class="container my-5">
    <div class="main-player card shadow-lg p-4 bg-gradient-dark rounded-4">
      <div class="card-body text-center">
        <div class="album-cover-container mb-4">
          <img id="current-cover" src="img/default-cover.jpg" class="img-fluid rounded-3 shadow-sm" alt="Portada del álbum">
        </div>
        
        <h2 id="current-title" class="fw-bold mb-1">Selecciona una canción</h2>
        <p id="current-artist" class="text-secondary mb-3">Artista desconocido</p>
        
        <audio id="main-audio" class="w-100" preload="auto">
          <source id="main-source" src="" type="audio/mpeg">
          Tu navegador no soporta audio.
        </audio>
        
        </div>
    </div>
  </div>

  <div class="container mb-5">
    <h3 class="text-white fw-bold mb-4">Explorar Canciones</h3>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="song-list-container">
      
      <div class="col">
        <div class="song-card card bg-secondary-dark text-light border-0 shadow-sm rounded-3 h-100">
          <img src="img/portada1.jpg" class="card-img-top rounded-top-3" alt="Portada del álbum de Canción 1">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h4 class="card-title h6 fw-bold">Canción 1</h4> 
              <p class="card-text text-light-subtle">Artista 1</p>
            </div>
            <button class="btn btn-primary-gradient btn-play mt-3"
             data-title="Hand of Blood"
              data-artist="Bullet for my valentitne"
             data-src="https://docs.google.com/uc?export=download&id=1-fMFAAlQff4izYo2Fke2iDc1EwWQ9pUz"
             data-cover="img/Hand_of_sangre.webp">
             ▶️ Reproducir
            </button>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="song-card card bg-secondary-dark text-light border-0 shadow-sm rounded-3 h-100">
          <img src="img/portada2.jpg" class="card-img-top rounded-top-3" alt="Portada del álbum de Canción 2">
          <div class="card-body d-flex flex-column justify-content-between">
            <div>
              <h4 class="card-title h6 fw-bold">Canción 2</h4>
              <p class="card-text text-light-subtle">Artista 2</p>
            </div>
            <button class="btn btn-primary-gradient btn-play mt-3"
              data-title="Canción 2"
              data-artist="Bullet for my valentitne"
              data-src="musica/cancion2.mp3"
              data-cover="img/Hand_of_sangre.webp">
              ▶️ Reproducir
            </button>
          </div>
        </div>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
