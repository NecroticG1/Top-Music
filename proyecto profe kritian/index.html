<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎵 Top Music 🎵</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-black">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">🎵 Top Music 🎵</a>
    </div>
  </nav>

  <!-- Reproductor Principal -->
  <div class="container my-4">
    <div class="card bg-secondary text-light">
      <div class="card-body text-center">
        <h5 id="current-title">Selecciona una canción</h5>
        <audio id="main-audio" controls class="w-100 mt-3">
          <source id="main-source" src="" type="audio/mpeg">
          Tu navegador no soporta audio.
        </audio>
      </div>
    </div>
  </div>

  <!-- Lista de Canciones -->
  <div class="container">
    <div class="row row-cols-1 row-cols-md-2 g-4">

      <!-- Canción 1 -->
      <div class="col">
        <div class="card bg-secondary text-light h-100">
          <img src="img/portada1.jpg" class="card-img-top" alt="Portada 1">
          <div class="card-body">
            <h5 class="card-title">Canción 1</h5>
            <p class="card-text">Artista 1</p>
            <button class="btn btn-light btn-play"
              data-title="Canción 1"
              data-src="musica/cancion1.mp3">
              ▶️ Reproducir
            </button>
          </div>
        </div>
      </div>

      <!-- Canción 2 -->
      <div class="col">
        <div class="card bg-secondary text-light h-100">
          <img src="img/portada2.jpg" class="card-img-top" alt="Portada 2">
          <div class="card-body">
            <h5 class="card-title">Canción 2</h5>
            <p class="card-text">Artista 2</p>
            <button class="btn btn-light btn-play"
              data-title="Canción 2"
              data-src="musica/cancion2.mp3">
              ▶️ Reproducir
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <footer class="text-center py-4 mt-5 bg-black">
    <p class="mb-0 text-muted">🎧 Mini SoundCloud — Demo con JS + Bootstrap</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
